apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bossfang-default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bossfang-runtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bossfang
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sansaba-workspace
          podSelector:
            matchLabels:
              app.kubernetes.io/name: sansaba-workspace
      ports:
        - port: 4545
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uar
      ports:
        - port: 1906
          protocol: TCP
