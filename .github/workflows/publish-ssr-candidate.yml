name: Publish SSR candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Load private dependency key
        shell: bash
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "${{ secrets.KREUZBERG_SSH_KEY }}" > ~/.ssh/id_kreuzberg
          chmod 0600 ~/.ssh/id_kreuzberg
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_kreuzberg
          printf 'SSH_AUTH_SOCK=%s\n' "${SSH_AUTH_SOCK}" >> "${GITHUB_ENV}"
          printf 'SSH_AGENT_PID=%s\n' "${SSH_AGENT_PID}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ssr
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          ssh: default=${{ env.SSH_AUTH_SOCK }}
          cache-from: type=gha,scope=sansaba-ssr-candidate
          cache-to: type=gha,mode=max,scope=sansaba-ssr-candidate
          tags: ghcr.io/gqadonis/bossfang:sha-${{ github.sha }}
