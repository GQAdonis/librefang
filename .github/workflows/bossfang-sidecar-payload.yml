name: BossFang sidecar payload for The Boss

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full BossFang source commit to build and pin in The Boss
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bossfang-sidecar-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  native_payload:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      TARGET: ${{ matrix.target }}
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "1"
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
      BOSSFANG_REQUIRE_EMBEDDED_DASHBOARD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
      - name: Verify immutable source and native target
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "source_sha must be a full commit" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA" || { echo "Checkout differs from source_sha" >&2; exit 1; }
          if [ "$TARGET" = "aarch64-apple-darwin" ]; then
            test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64
          else
            test "$TARGET" = "x86_64-pc-windows-msvc" && test "$RUNNER_OS" = Windows
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - name: Build BossFang dashboard assets
        shell: bash
        working-directory: crates/librefang-api/dashboard
        run: |
          pnpm install --frozen-lockfile --config.strict-dep-builds=false
          pnpm run build
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install target on the pinned workspace toolchain
        shell: bash
        run: rustup target add "$TARGET"
      - name: Build native BossFang executable with embedded dashboard
        shell: bash
        env:
          SKIP_DASHBOARD_BUILD: "1"
        run: cargo build --release --locked --target "$TARGET" -p librefang-cli --bin bossfang --features telemetry,surreal-backend,uar-driver
      - name: Record pinned payload and checksums
        shell: bash
        run: node scripts/package-bossfang-sidecar.mjs "$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bossfang-sidecar-${{ matrix.target }}-${{ inputs.source_sha }}
          path: dist/bossfang-sidecar/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30
